name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install slack-bolt==1.30.0 slack-cli-hooks==0.3.0 slack-sdk==3.44.1
      - run: ruff check .
      - run: python -m pytest
      - run: sgnlol validate-config --config config/orgs.example.yaml
