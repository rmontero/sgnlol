[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sgnlol"
version = "0.2.0"
description = "GitHub and Slack relevance triage with an operator dashboard"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "openai-agents>=0.4,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "standardwebhooks>=1.1,<2", "redis>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
slack = ["slack-bolt>=1.30,<2", "slack-cli-hooks<1"]

[project.scripts]
sgnlol = "triage.cli:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["triage*", "listeners*"]

[tool.setuptools.package-data]
triage = ["static/dashboard/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 125
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
